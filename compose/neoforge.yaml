name: mc-neoforge

services:
  mc:
    image: itzg/minecraft-server:2026.9.2-java21
    container_name: mc-neoforge
    restart: unless-stopped
    stdin_open: true
    tty: true
    stop_grace_period: 1m
    ports:
      - "25565:25565/tcp"
      - "24454:24454/udp"
    volumes:
      - ../server-data-neoforge:/data
      - ../mods:/data/mods
      - ../server-icon.png:/server-icon.png:ro
    env_file:
      - path: ../.env
        required: false
    environment:
      EULA: "true"
      TYPE: "NEOFORGE"
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.248"
      TZ: "America/Sao_Paulo"

      MEMORY: "5G"
      USE_AIKAR_FLAGS: "true"
      JVM_XX_OPTS: "-XX:ActiveProcessorCount=3"

      ICON: "/server-icon.png"
      OVERRIDE_ICON: "true"

      MOTD: "Guerra dos Rapazes"
      LEVEL: "guerra"
      MAX_PLAYERS: "10"
      DIFFICULTY: "hard"
      PVP: "true"
      SPAWN_PROTECTION: "0"
      ALLOW_FLIGHT: "true"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "6"
      MAX_TICK_TIME: "-1"
      SYNC_CHUNK_WRITES: "false"

      ENABLE_RCON: "true"
    deploy:
      resources:
        limits:
          cpus: "3.5"
          memory: "7G"
