name: mc-paper

services:
  mc:
    image: itzg/minecraft-server:2026.9.2-java25
    container_name: mc-paper
    restart: unless-stopped
    stdin_open: true
    tty: true
    stop_grace_period: 1m
    ports:
      - "25565:25565/tcp"
      - "24454:24454/udp"
    volumes:
      - ../server-data:/data
      - ../plugins:/plugins:ro
      - ../server-icon.png:/server-icon.png:ro
    env_file:
      - path: ../.env
        required: false
    environment:
      EULA: "true"
      TYPE: "PAPER"
      VERSION: "26.3"
      PAPER_CHANNEL: "experimental"
      TZ: "America/Sao_Paulo"

      MEMORY: "4G"
      USE_AIKAR_FLAGS: "true"
      JVM_XX_OPTS: "-XX:ActiveProcessorCount=3"

      REMOVE_OLD_MODS: "true"
      ICON: "/server-icon.png"
      OVERRIDE_ICON: "true"

      MOTD: "CIC Transa"
      LEVEL: "sexo"
      MAX_PLAYERS: "10"
      DIFFICULTY: "hard"
      PVP: "true"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"

      ENABLE_RCON: "true"
    deploy:
      resources:
        limits:
          cpus: "3.5"
          memory: "5G"
