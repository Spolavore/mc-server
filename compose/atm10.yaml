name: mc-atm10

services:
  mc:
    image: itzg/minecraft-server:2026.9.2-java21
    container_name: mc-atm10
    restart: unless-stopped
    stdin_open: true
    tty: true
    stop_grace_period: 1m
    ports:
      - "25566:25565/tcp"
    volumes:
      - ../server-data-atm10:/data
    env_file:
      - path: ../.env
        required: false
    environment:
      EULA: "true"
      TYPE: "NEOFORGE"
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.247"
      TZ: "America/Sao_Paulo"

      MEMORY: "${ATM10_MEMORY:-4G}"
      USE_AIKAR_FLAGS: "true"
      JVM_XX_OPTS: "-XX:ActiveProcessorCount=${ATM10_APC:-3}"

      MOTD: "ATM10 - teste"
      LEVEL: "atm10"
      MAX_PLAYERS: "5"
      DIFFICULTY: "normal"
      ALLOW_FLIGHT: "true"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      MAX_TICK_TIME: "-1"
      SYNC_CHUNK_WRITES: "false"

      ENABLE_RCON: "true"
    deploy:
      resources:
        limits:
          cpus: "${ATM10_CPUS:-3.5}"
          memory: "${ATM10_MEM_LIMIT:-6G}"
