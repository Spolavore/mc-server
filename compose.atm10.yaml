services:
  mc-atm10:
    image: itzg/minecraft-server:java21
    container_name: minecraft-atm10
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "25566:25565/tcp"   # 25565 e do servidor guerra; ATM10 fica no 25566
    volumes:
      - ./server-data-atm10:/data
    environment:
      EULA: "true"
      TYPE: "NEOFORGE"
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.247"   # versao que o proprio server pack do ATM10 8.0 fixa
      TZ: "America/Sao_Paulo"

      # 455 mods custam ~1.4G de metaspace/GC/code cache em cima do heap, e o Aikar commita
      # o heap inteiro de saida: 6G de heap deu 7.4G de RSS. Ajuste por maquina no .env.
      MEMORY: "${ATM10_MEMORY:-4G}"
      USE_AIKAR_FLAGS: "true"

      MOTD: "ATM10 - teste"
      LEVEL: "atm10"
      MAX_PLAYERS: "5"
      DIFFICULTY: "normal"
      ALLOW_FLIGHT: "true"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      MAX_TICK_TIME: "-1"
      SYNC_CHUNK_WRITES: "false"
      OVERRIDE_SERVER_PROPERTIES: "true"

      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?defina RCON_PASSWORD no .env}"
      OPS: "${OPS:-}"

      JVM_XX_OPTS: "-XX:ActiveProcessorCount=${ATM10_APC:-3}"
    deploy:
      resources:
        limits:
          cpus: "${ATM10_CPUS:-3.5}"
          memory: "${ATM10_MEM_LIMIT:-6G}"
